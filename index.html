<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>
Restaurant Table Booking
</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
rel="stylesheet">

<link
rel="stylesheet"
href="css/style.css">

<script
defer
src="js/app.js">
</script>

</head>

<body>

<div
class="auth-container"
id="auth">

<div class="auth-card">

<h1 id="authTitle">

Register

</h1>

<form id="authForm">

<input
class="form-control mb-3"
placeholder="Username"
required>

<input
type="password"
class="form-control mb-3"
placeholder="Password"
required>

<button
type="submit"
class="btn btn-warning w-100">

Continue

</button>

</form>

</div>

</div>


<div
id="mainWebsite"
class="hidden">

<nav class="navbar navbar-dark bg-dark">

<div class="container">

<span
class="navbar-brand">

AnTeRa Kitchen & Bar

</span>

</div>

</nav>


<section
id="home"
class="hero">

<h1>

Welcome To AnTeRa

</h1>

<p>

Book Your Table Now

</p>

<button
class="btn btn-warning"

onclick="showSection('booking')">

Book Now

</button>

</section>



<div
id="booking"
class="container section-container">

<h1>

Book Table

</h1>

<form id="bookingForm">

<input
id="name"
class="form-control mb-3"
placeholder="Full Name"
required>

<input
id="phone"
class="form-control mb-3"
placeholder="Phone Number"
required>

<input
type="date"
id="date"
class="form-control mb-3"
required>

<input
type="time"
id="time"
class="form-control mb-3"
required>

<input
type="number"
id="guests"
class="form-control mb-3"
placeholder="Guests"
required>

<button
class="btn btn-success">

Reserve

</button>

</form>

</div>


<div
id="confirmationPage"
class="container section-container">

<h1>

✅ Booking Confirmed

</h1>

<h3>

Thank you for booking.

</h3>

<p>

If any queries contact:

</p>

<h2>

📞 +91 7373734634

</h2>

<button
class="btn btn-warning"

onclick="location.reload()">

Back Home

</button>

</div>

</div>

</body>

</html>
