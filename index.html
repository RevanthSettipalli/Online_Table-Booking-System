<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Restaurant Table Booking</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

<link rel="stylesheet"
href="css/style.css">

<script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script defer src="js/app.js"></script>

</head>

<body>

<!-- Authentication -->

<div class="auth-container" id="auth">

<div class="auth-card">

<h2 id="authTitle">Register</h2>

<form id="authForm">

<input type="text"
id="username"
class="form-control mb-3"
placeholder="Username"
required>

<input type="password"
id="password"
class="form-control mb-3"
placeholder="Password"
required>

<button class="btn btn-warning w-100">
Register
</button>

</form>

<p class="text-center mt-3">

<span id="authToggleText">

Already have account?

</span>

<button
class="btn btn-link"
onclick="toggleAuth()">

Login

</button>

</p>

</div>

</div>

<div id="mainWebsite" class="hidden">

<nav class="navbar navbar-dark bg-dark">

<div class="container">

<a class="navbar-brand">

AnTeRa Kitchen & Bar

</a>

</div>

</nav>

<section id="home" class="hero">

<h1>Welcome To AnTeRa</h1>

<p>Book Your Table</p>

<button
class="btn btn-warning"
onclick="showSection('booking')">

Book Now

</button>

</section>

<div
id="booking"
class="container section-container">

<h2>Book Table</h2>

<form id="bookingForm">

<input
type="date"
id="date"
class="form-control mb-3"
required>

<input
type="time"
id="time"
class="form-control mb-3"
required>

<input
type="number"
id="guests"
class="form-control mb-3"
placeholder="Guests"
required>

<button class="btn btn-success">

Reserve

</button>

</form>

</div>

<div
id="gallery"
class="container section-container">

<h2>Gallery</h2>

<div class="gallery">

<img src="https://tse4.mm.bing.net/th?id=OIP.XkGFlsL6j75_jEJ2l6FHewHaE8">

<img src="https://tse3.mm.bing.net/th?id=OIP.15-fJJzNuj_5-CBu-ycGGwHaEK">

</div>

</div>

<div
id="contact"
class="container section-container">

<h2>Contact</h2>

<p>📍 Jubilee Hills Hyderabad</p>

<p>📞 +91 7373734634</p>

</div>

</div>

</body>

</html>
