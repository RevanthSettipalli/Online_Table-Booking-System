<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Restaurant Table Booking</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
rel="stylesheet">

<link
rel="stylesheet"
href="css/style.css">

<script defer src="js/app.js"></script>

</head>

<body>


<div id="auth" class="auth-container">

<div class="auth-card">

<h1 id="authTitle">

Register

</h1>

<form id="authForm">

<input
id="username"
class="form-control mb-3"
placeholder="Username"
required>

<input
id="password"
type="password"
class="form-control mb-3"
placeholder="Password"
required>

<button
id="submitBtn"
class="btn btn-warning w-100">

Register

</button>

</form>

<p>

<span id="authText">

Already have account?

</span>

<button
type="button"
onclick="toggleAuth()"
class="btn btn-link">

Login

</button>

</p>

</div>

</div>



<div
id="mainWebsite"
class="hidden">


<section
id="home"
class="hero section-container">

<h1>

Welcome To AnTeRa

</h1>

<p>

Reserve Your Table

</p>

<button
onclick="showSection('booking')"
class="btn btn-warning">

Book Now

</button>

</section>



<div
id="booking"
class="container section-container">

<h1>

Table Booking

</h1>

<form id="bookingForm">

<input
id="name"
class="form-control mb-3"
placeholder="Full Name"
required>

<input
id="phone"
class="form-control mb-3"
placeholder="Phone Number"
required>

<input
type="date"
id="date"
class="form-control mb-3"
required>

<input
type="time"
id="time"
class="form-control mb-3"
required>

<input
type="number"
id="guests"
class="form-control mb-3"
placeholder="Guests"
required>

<button
class="btn btn-success">

Reserve

</button>

</form>

</div>



<div
id="thankyou"
class="container section-container">

<h1>

✅ Booking Confirmed

</h1>

<h4>

Thanks For Choosing Us

</h4>

<p>

If any queries contact:

</p>

<h3>

📞 +91 7373734634

</h3>

<button
onclick="goHome()"
class="btn btn-warning">

Home

</button>

</div>


</div>

</body>

</html>
