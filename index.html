<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Restaurant Table Booking</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
rel="stylesheet">

<link
rel="stylesheet"
href="css/style.css">

<script defer
src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
</script>

<script defer src="js/app.js"></script>

</head>

<body>

<!-- LOGIN -->

<div class="auth-container" id="auth">

<div class="auth-card">

<h1 id="authTitle">
Register
</h1>

<form id="authForm">

<input
type="text"
id="username"
class="form-control mb-3"
placeholder="Username"
required>

<input
type="password"
id="password"
class="form-control mb-3"
placeholder="Password"
required>

<button
type="submit"
class="btn btn-primary w-100">

Register

</button>

</form>

<p class="mt-3">

<span id="authToggleText">
Already have account?
</span>

<button
class="btn btn-link"
onclick="toggleAuth()"
type="button">

Login

</button>

</p>

</div>

</div>

<!-- WEBSITE -->

<div
id="mainWebsite"
class="hidden">

<nav class="navbar navbar-dark bg-dark">

<div class="container">

<a class="navbar-brand">

AnTeRa Kitchen & Bar

</a>

</div>

</nav>

<!-- HOME -->

<section
id="home"
class="hero section-container">

<h1>

Welcome To AnTeRa

</h1>

<p>

Book Your Table Now

</p>

<button
class="btn btn-warning"

onclick="showSection('booking')">

Book Now

</button>

</section>

<!-- BOOKING -->

<div
id="booking"
class="container section-container"
style="display:none">

<h1>

Book Table

</h1>

<form id="bookingForm">

<input
type="text"
id="name"
class="form-control mb-3"
placeholder="Enter Name"
required>

<input
type="tel"
id="phone"
class="form-control mb-3"
placeholder="Phone Number"
required>

<input
type="date"
id="date"
class="form-control mb-3"
required>

<input
type="time"
id="time"
class="form-control mb-3"
required>

<input
type="number"
id="guests"
class="form-control mb-3"
placeholder="Guests"
required>

<button
type="submit"
class="btn btn-success">

Reserve

</button>

</form>

</div>

<!-- CONFIRM -->

<div
id="confirmationPage"
class="container section-container"
style="display:none">

<h1>

✅ Booking Confirmed

</h1>

<h4>

Your reservation has been confirmed.

</h4>

<p>

For queries:

</p>

<p>

📞 +91 7373734634

</p>

<button
class="btn btn-warning"
onclick="showSection('home')">

Back Home

</button>

</div>

<!-- GALLERY -->

<div
id="gallery"
class="container section-container"
style="display:none">

<h1>

Gallery

</h1>

<div class="gallery">

<img
src="https://tse4.mm.bing.net/th?id=OIP.XkGFlsL6j75_jEJ2l6FHewHaE8">

<img
src="https://tse3.mm.bing.net/th?id=OIP.15-fJJzNuj_5-CBu-ycGGwHaEK">

</div>

</div>

<!-- CONTACT -->

<div
id="contact"
class="container section-container"
style="display:none">

<h1>

Contact

</h1>

<p>

📍 Jubilee Hills Hyderabad

</p>

<p>

📞 +91 7373734634

</p>

</div>

</div>

</body>

</html>
