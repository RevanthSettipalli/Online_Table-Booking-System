<!DOCTYPE html>
<html>

<head>

<title>Restaurant Table Booking</title>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
rel="stylesheet">

<link rel="stylesheet"
href="css/style.css">

<script defer src="js/app.js"></script>

</head>

<body>


<!-- LOGIN -->

<div id="auth" class="auth-container">

<div class="auth-card">

<h1 id="authTitle">
Register
</h1>

<form id="authForm">

<input
id="username"
class="form-control mb-3"
placeholder="Username"
required>

<input
id="password"
type="password"
class="form-control mb-3"
placeholder="Password"
required>

<button
id="submitBtn"
class="btn btn-warning w-100">

Register

</button>

</form>

<p>

<span id="authText">

Already have account?

</span>

<button
onclick="toggleAuth()"
class="btn btn-link"
type="button">

Login

</button>

</p>

</div>

</div>



<!-- WEBSITE -->

<div
id="mainWebsite"
class="hidden">


<section
id="home"
class="hero section-container">

<h1>

Welcome To AnTeRa

</h1>

<h4>

Book Your Table

</h4>

<button
onclick="showSection('booking')"
class="btn btn-warning">

BOOK NOW

</button>

</section>



<!-- BOOKING -->

<div
id="booking"
class="container section-container"
style="display:none">

<h1>

Book Table

</h1>

<form id="bookingForm">

<input
class="form-control mb-3"
placeholder="Full Name"
required>

<input
class="form-control mb-3"
placeholder="Phone Number"
required>

<input
type="date"
class="form-control mb-3"
required>

<input
type="time"
class="form-control mb-3"
required>

<input
type="number"
class="form-control mb-3"
placeholder="No Of Guests"
required>

<button
class="btn btn-success">

Reserve

</button>

</form>

</div>



<!-- THANK YOU -->

<div
id="thankyou"
class="container section-container"
style="display:none">

<h1>

❤️ Thanks For Choosing Us

</h1>

<h4>

Your Table Has Been Confirmed

</h4>

<p>

For Queries Call

</p>

<h3>

📞 +91 7373734634

</h3>

<button
class="btn btn-warning"
onclick="showSection('home')">

Home

</button>

</div>


</div>

</body>

</html>
