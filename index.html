<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Restaurant Table Booking</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
rel="stylesheet">

<link
rel="stylesheet"
href="css/style.css">

<script
defer
src="js/app.js"></script>

</head>

<body>

<!-- LOGIN / REGISTER -->

<div
class="auth-container"
id="auth">

<div class="auth-card">

<h1 id="authTitle">

Register

</h1>

<form id="authForm">

<input
type="text"
class="form-control"
placeholder="Username"
required>

<br>

<input
type="password"
class="form-control"
placeholder="Password"
required>

<br>

<button
type="submit"
class="btn btn-warning w-100">

Register

</button>

</form>

<br>

<p>

<span id="authToggleText">

Already have account?

</span>

<a
href="#"
onclick="toggleAuth()">

Login

</a>

</p>

</div>

</div>



<!-- WEBSITE -->

<div
id="mainWebsite"
class="hidden">


<!-- HOME -->

<section
class="hero">

<h1>

Welcome To AnTeRa

</h1>

<p>

Book Your Table Now

</p>

<button
onclick="showBooking()"
class="btn btn-warning">

Book Now

</button>

</section>



<!-- BOOKING FORM -->

<div
id="booking"
class="hidden">

<h2>

Table Booking

</h2>

<form id="bookingForm">

<input
type="text"
id="name"
placeholder="Full Name"
class="form-control"
required>

<br>

<input
type="tel"
id="phone"
placeholder="Phone Number"
class="form-control"
required>

<br>

<input
type="date"
id="date"
class="form-control"
required>

<br>

<input
type="time"
id="time"
class="form-control"
required>

<br>

<input
type="number"
id="guests"
placeholder="Guests"
class="form-control"
min="1"
required>

<br>

<button
type="submit"
class="btn btn-success">

Reserve

</button>

</form>

</div>



<!-- THANK YOU PAGE -->

<div
id="thankyou"
class="hidden">

<h1>

✅ Booking Confirmed

</h1>

<h2>

Thanks For Choosing Us

</h2>

<p>

If any queries contact:

</p>

<p>

📞 +91 7373734634

</p>

<button
onclick="goHome()"
class="btn btn-warning">

Home

</button>

</div>


</div>

</body>

</html>
