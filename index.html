<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Restaurant Table Booking</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
rel="stylesheet">

<link rel="stylesheet" href="css/style.css">

<script defer src="js/app.js"></script>

</head>

<body>

<!-- LOGIN -->

<div id="auth" class="auth-container">

<div class="auth-card">

<h1 id="authTitle">Register</h1>

<form id="authForm">

<input
type="text"
class="form-control mb-3"
placeholder="Username"
required>

<input
type="password"
class="form-control mb-3"
placeholder="Password"
required>

<button
type="submit"
class="btn btn-warning w-100">

Register

</button>

</form>

<p>

<span id="authToggleText">

Already have account?

</span>

<button
onclick="toggleAuth()"
class="btn btn-link">

Login

</button>

</p>

</div>

</div>


<!-- WEBSITE -->

<div id="mainWebsite" class="hidden">

<section
id="home"
class="hero">

<h1>

Welcome To AnTeRa

</h1>

<button
id="bookBtn"
class="btn btn-warning">

Book Now

</button>

</section>


<!-- BOOKING -->

<section
id="booking">

<h2>

Table Booking

</h2>

<form id="bookingForm">

<input
id="fullName"
class="form-control"
placeholder="Full Name"
required>

<input
id="phone"
class="form-control"
placeholder="Phone Number"
required>

<input
type="date"
class="form-control"
required>

<input
type="time"
class="form-control"
required>

<input
type="number"
class="form-control"
placeholder="Guests"
required>

<button
class="btn btn-success">

Reserve

</button>

</form>

</section>


<!-- THANK YOU -->

<section
id="thankyou">

<h1>

✅ Booking Confirmed

</h1>

<h2>

Thanks For Choosing Us

</h2>

<p>

If any queries contact

</p>

<p>

📞 +91 7373734634

</p>

<button
onclick="goHome()"
class="btn btn-warning">

Home

</button>

</section>

</div>

</body>

</html>
