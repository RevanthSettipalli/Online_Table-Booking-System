<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<title>
Restaurant Table Booking
</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
rel="stylesheet">

<link
rel="stylesheet"
href="css/style.css">

<script
defer
src="js/app.js">
</script>

</head>

<body>


<!-- LOGIN -->

<div
id="auth"
class="auth-container">

<div class="auth-card">

<h1 id="authTitle">

Register

</h1>

<form id="authForm">

<input
class="form-control mb-3"
placeholder="Username"
required>

<input
type="password"
class="form-control mb-3"
placeholder="Password"
required>

<button
type="submit"
class="btn btn-warning w-100">

Register

</button>

</form>

<p>

<span id="authToggleText">

Already have account?

</span>

<button
class="btn btn-link"
onclick="toggleAuth()">

Login

</button>

</p>

</div>

</div>



<!-- MAIN -->

<div
id="mainWebsite"
class="hidden">



<!-- HOME -->

<section
id="home"
class="hero">

<h1>

Welcome To AnTeRa

</h1>

<p>

Reserve Your Table

</p>

<button
id="bookBtn"
class="btn btn-warning">

Book Now

</button>

</section>



<!-- BOOKING -->

<section
id="booking"
style="display:none">

<h2>

Table Booking

</h2>

<form
id="bookingForm">

<input
class="form-control mb-3"
placeholder="Full Name"
required>

<input
class="form-control mb-3"
placeholder="Phone Number"
required>

<input
type="date"
class="form-control mb-3"
required>

<input
type="time"
class="form-control mb-3"
required>

<input
type="number"
class="form-control mb-3"
placeholder="Guests"
required>

<button
class="btn btn-success">

Reserve

</button>

</form>

</section>



<!-- THANKYOU -->

<section
id="thankyou"
style="display:none">

<h1>

✅ Booking Confirmed

</h1>

<h2>

Thanks For Choosing Us

</h2>

<p>

If any queries contact

</p>

<p>

📞 +91 7373734634

</p>

<button
onclick="goHome()"
class="btn btn-warning">

Home

</button>

</section>


</div>

</body>

</html>
