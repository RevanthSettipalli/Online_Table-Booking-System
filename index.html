<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Hotel Booking System</title>

<link rel="stylesheet"
href="./css/style.css">

</head>

<body>

<div id="registerPage" class="container">

<h2>Register</h2>

<form onsubmit="return registerUser()">

<input
type="text"
id="regUsername"
placeholder="Username"
required>

<input
type="password"
id="regPassword"
placeholder="Password"
required>

<button type="submit">

Register

</button>

</form>

<p>

Already have an account?

<a
href="#"
onclick="showPage('loginPage')">

Login here

</a>

</p>

</div>

<div
id="loginPage"
class="container hidden">

<h2>Login</h2>

<form
onsubmit=
"return validateLogin()">

<input
type="text"
id="username"
placeholder="Username"
required>

<input
type="password"
id="password"
placeholder="Password"
required>

<button type="submit">

Login

</button>

</form>

<p>

Don't have an account?

<a
href="#"
onclick=
"showPage('registerPage')">

Register here

</a>

</p>

</div>

<div
id="bookingPage"
class="container hidden">

<h2>

Table Booking

</h2>

<form
onsubmit=
"return confirmBooking(event)">

<input
type="text"
id="name"
placeholder="Name"
required>

<input
type="date"
id="date"
required>

<input
type="time"
id="time"
required>

<input
type="number"
id="guests"
min="1"
placeholder="Guests"
required>

<button>

Book Now

</button>

</form>

</div>

<div
id="ambiencePage"
class="container hidden">

<h2>

Gallery

</h2>

<button
onclick=
"showPage('bookingPage')">

Book a Table

</button>

</div>

<div
id="contactPage"
class="container hidden">

<h2>

Contact Us

</h2>

<p>

📞 +91 7013235874

</p>

<button
onclick=
"showPage('loginPage')">

Back

</button>

</div>

<script src="./js/app.js"></script>

</body>

</html>
